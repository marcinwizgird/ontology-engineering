# Offline PostgreSQL dialect configuration for the ontop-sidecar.
# The URL names a host that does not exist and the sidecar has no network route to any
# database: Ontop reads the schema from db-metadata.json (--db-metadata) and starts
# lazily (--lazy), so it only ever *reformulates*; it never connects.
jdbc.url=jdbc:postgresql://no-database.invalid:5432/fiben
jdbc.driver=org.postgresql.Driver
jdbc.user=none
jdbc.password=none
